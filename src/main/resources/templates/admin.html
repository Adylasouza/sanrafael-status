<form id="productForm" onsubmit="criarNovoProduto(event)">
    <input type="text" id="nomeProduto" placeholder="Ej: Sistema de Urgencias" required />
    <button type="submit">Guardar Producto</button>
</form>

<script>
    async function criarNovoProduto(event) {
        event.preventDefault(); // Impede o recarregamento tradicional da página

        const nome = document.getElementById("nomeProduto").value;

        // 1. CAPTURA O TOKEN SALVO NO NAVEGADOR (AQUI entra o código)
        const token = localStorage.getItem("sanrafael_token");

        // Dados estruturados que o seu CreateProductDTO espera receber no back-end
        const dadosDoProduto = {
            name: nome
        };

        try {
            // 2. DISPARA A REQUISIÇÃO REST PARA A API PROTEGIDA
            const response = await fetch("/api/produtos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    // Injeta o Token JWT para passar sem problemas pelo seu JwtFilter do Java
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify(dadosDoProduto)
            });

            if (response.ok) {
                alert("¡Producto creado con éxito por el Administrador!");
                window.location.reload();
            } else if (response.status === 403 || response.status === 401) {
                alert("Acceso Denegado: No tienes permisos de administrador.");
            } else {
                alert("Errores al procesar la solicitud.");
            }
        } catch (error) {
            console.error("Error:", error);
        }
    }
</script>
